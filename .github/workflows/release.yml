name: "Release new version"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  releasetag:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[RELEASE]') || contains(github.event_name, 'workflow')"
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate Semantic Release Version
        uses: cycjimmy/semantic-release-action@v8
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.semantic.outputs.new_release_git_tag }}
          prerelease: false

  pyinstaller:
    runs-on: ${{ matrix.config.os }}
    needs: [releasetag]
    if: needs.releasetag.outputs.version != ''
    name: Package the application using PyInstaller
    strategy:
      matrix:
        config:
          - { os: ubuntu-latest, arch: x64, name: linux, extension: "" }
          - { os: windows-latest, arch: x64, name: windows, extension: ".exe" }

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          python-version: "3.14"
      - name: Package the app using PyInstaller
        run: |
          uv sync --locked --extra ui
          uv run --no-sync pyinstaller hikload.spec

      - uses: actions/upload-artifact@v7
        with:
          name: hikload-${{ matrix.config.name }}-${{ matrix.config.arch }}
          path: dist/hikload${{ matrix.config.extension }}

      - name: Upload Release Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "dist/hikload${{ matrix.config.extension }}" "dist/hikload-${{ matrix.config.name }}-${{ matrix.config.arch }}${{ matrix.config.extension }}"
          gh release upload "${{ needs.releasetag.outputs.tag }}" "dist/hikload-${{ matrix.config.name }}-${{ matrix.config.arch }}${{ matrix.config.extension }}" --clobber

  pypipublish:
    runs-on: ubuntu-latest
    needs: [releasetag]
    if: needs.releasetag.outputs.version != ''
    name: Package the application and publish it to PyPi

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.9"
          python-version: "3.14"

      - name: Update version in pyproject.toml
        env:
          NEW_VERSION: ${{ needs.releasetag.outputs.version }}
        run: |
          uv run --no-project python -c "import os, pathlib, re; p = pathlib.Path('pyproject.toml'); p.write_text(re.sub(r'^version = \"[^\"]+\"', f'version = \"{os.environ[\"NEW_VERSION\"]}\"', p.read_text(), count=1, flags=re.MULTILINE))"
          uv lock

      - uses: EndBug/add-and-commit@v11
        with:
          add: pyproject.toml uv.lock
          default_author: github_actions
          message: "ci: increment version in pyproject.toml"

      - name: Build package
        run: uv build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  dockerpublish:
    runs-on: ubuntu-latest
    needs: [releasetag]
    if: needs.releasetag.outputs.version != ''
    name: Package the application and publish it to Github Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tedyst
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tedyst/hikload:${{ needs.releasetag.outputs.version }}
            ghcr.io/tedyst/hikload:latest
          cache-from: type=gha
          cache-to: type=gha
          platforms: linux/amd64,linux/arm64
